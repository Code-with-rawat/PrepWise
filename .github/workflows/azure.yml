
name: Azure OIDC Authentication

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  azure-login:
    name: Authenticate with Azure using OIDC
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout GitHub repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Authenticate with Microsoft Entra ID
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Verify Azure authentication
      - name: Verify Azure Authentication
        run: |
          echo "Azure authentication successful!"
          az account show --output table

      # Step 4: Verify Azure CLI access
      - name: Verify Azure CLI
        run: |
          az --version
